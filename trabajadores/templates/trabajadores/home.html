{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<style>
  .dashboard-card {
    background: rgba(255,255,255,0.9);
    border-radius: 10px;
    padding: 2rem;
    margin: 2rem auto;
    max-width: 700px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.1);
  }
  .stat {
    display: flex;
    justify-content: space-between;
    padding: 1rem 0;
    border-bottom: 1px solid #ececec;
  }
  .stat:last-child { border-bottom: none; }
  .stat-label { font-weight: 600; }
  .stat-value { font-size: 1.2rem; color: #007bff; }
</style>

<div class="container">
  <h2 class="text-white text-center mb-5">Dashboard de Trabajadores</h2>
  <div class="row g-4">
      <div class="col-md-3">
          <div class="card text-white bg-primary shadow h-100">
              <div class="card-body text-center">
                  <h5 class="card-title">Total Trabajadores</h5>
                  <h3>{{ total }}</h3>
              </div>
          </div>
      </div>
      <div class="col-md-3">
          <div class="card text-white bg-success shadow h-100">
              <div class="card-body text-center">
                  <h5 class="card-title">Activos</h5>
                  <h3>{{ activos }}</h3>
              </div>
          </div>
      </div>
      <div class="col-md-3">
          <div class="card text-white bg-danger shadow h-100">
              <div class="card-body text-center">
                  <h5 class="card-title">Inactivos</h5>
                  <h3>{{ inactivos }}</h3>
              </div>
          </div>
      </div>
      <div class="col-md-3">
          <div class="card text-white bg-warning shadow h-100">
              <div class="card-body text-center">
                  <h5 class="card-title">Prom. Sueldo Bruto</h5>
                  <h3>${{ promedio|floatformat:2 }}</h3>
              </div>
          </div>
      </div>
  </div>
</div>
{% endblock %}
