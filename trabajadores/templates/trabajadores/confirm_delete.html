{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Confirmar Eliminación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<div class="container mt-5">
  <div class="card shadow p-4">
    <h3 class="text-center text-danger mb-4">
      <i class="fas fa-exclamation-triangle"></i> Confirmar eliminación
    </h3>
    <p class="text-center fs-5">
      ¿Estás seguro que deseas eliminar al trabajador:
      <strong>{{ object.nombres }} {{ object.apellidos }}</strong>?
    </p>
    <p class="text-center text-muted">Esta acción marcará el registro como eliminado, pero no lo borrará permanentemente.</p>

    <form method="post" class="text-center mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger me-2">
        <i class="fas fa-trash-alt"></i> Sí, eliminar
      </button>
      <a href="{% url 'trabajadores:listar' %}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> Cancelar
      </a>
    </form>
  </div>
</div>

<script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
