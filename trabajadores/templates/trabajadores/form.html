{% extends 'base.html' %}
{% load widget_tweaks %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <div class="card form-card shadow-lg rounded-4">
        <div class="card-header text-white text-center rounded-top-4 form-header">
          <h4 class="mb-0 py-2">{{ accion }} Trabajador</h4>
        </div>

        <div class="card-body px-5 py-4">
          <form method="POST" enctype="multipart/form-data" id="trabajadorForm">
            {% csrf_token %}

            {% for field in form %}
              <div class="mb-4">
                <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                {{ field|add_class:"form-control" }}
              </div>
            {% endfor %}

            <!-- Botones -->
            <div class="d-flex justify-content-between mt-4">
              <button type="submit" class="btn btn-gradient"> {{ accion }} </button>
              <a href="{% url 'trabajadores:listar' %}" class="btn btn-outline-secondary btn-cancel">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
function togglePassword() {
  const input = document.getElementById("id_password");
  input.type = input.type === "password" ? "text" : "password";
}

window.addEventListener('DOMContentLoaded', () => {
  const errores = {
    {% for field in form %}
      {% if field.errors %}
        "{{ field.label }}": "{{ field.errors|join:', ' }}",
      {% endif %}
    {% endfor %}
  };

  if (Object.keys(errores).length > 0) {
    let mensaje = "";
    for (let campo in errores) {
      mensaje += `<b>${campo}</b>: ${errores[campo]}<br>`;
    }

    Swal.fire({
      icon: 'error',
      title: 'Errores en el formulario',
      html: mensaje,
      confirmButtonColor: '#e74c3c',
      confirmButtonText: 'Entendido'
    });
  }
});
</script>

<style>
  .form-card {
    background: #fff;
    border-radius: 12px;
    padding: 2rem;
    font-family: 'Segoe UI', sans-serif;
  }

  .form-header {
    background: linear-gradient(to right, #6a11cb, #2575fc);
  }

  label.form-label {
    font-weight: 600;
    color: #333;
  }

  input.form-control,
  select.form-control {
    border-radius: 8px;
    padding: 0.6rem 1rem;
    font-size: 1rem;
  }

  .btn-gradient {
    background: linear-gradient(to right, #6a11cb, #2575fc);
    color: white;
    padding: 0.6rem 1.8rem;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s ease;
  }

  .btn-gradient:hover {
    background: linear-gradient(to right, #2575fc, #6a11cb);
  }

  .btn-cancel {
    padding: 0.6rem 1.8rem;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s ease;
  }

  @media (max-width: 768px) {
    .form-card {
      padding: 1.2rem;
    }

    .btn-gradient,
    .btn-cancel {
      width: 48%;
    }

    .d-flex {
      flex-direction: column;
      gap: 1rem;
      align-items: stretch;
    }
  }
</style>
{% endblock %}
