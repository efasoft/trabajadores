{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body px-5 py-4">

          <!-- CABECERA CON ICONOS -->
          <div class="card-header-p fw-bold mb-4 d-flex justify-content-between align-items-center">
            TRABAJADORES
            <div>
              <!-- NUEVO: Icono para Guardar/Crear/Editar -->
              <button type="submit" form="trabajadorForm" class="btn btn-sm" title="{{ accion }}">
                <i class="fa fa-check icon-btn"
                    data-bs-toggle="tooltip"
                    title="{% if accion == 'Editar' %}Editar{% else %}Crear{% endif %}"                     
                ></i>
              </button>
              
              {% if accion == "Editar" %}
                <a href="#" class="btn btn-sm" title="Eliminar"> 
                  <i class="fa fa-trash icon-btn"
                  onclick="confirmarEliminar({{ trabajador.id }})"
                  data-bs-toggle="tooltip"
                  title="Eliminar" >    
                  </i>             
                </a>
              {% endif %}
              
              <a href="{% url 'trabajadores:listar' %}" class="btn btn-sm" title="Salir">
                <i class="fa fa-arrow-right icon-btn"
                    data-bs-toggle="tooltip"
                    title="Salir del Formulario"                     
                ></i>
              </a>
            </div>
          </div>

          <form method="POST" enctype="multipart/form-data" id="trabajadorForm">
            {% csrf_token %}

            <!-- DATOS DEL TRABAJADOR -->
            <div class="card mb-4 border-0 shadow-sm">
              <div class="card-header bg-light fw-bold">DATOS DEL TRABAJADOR</div>
              <div class="card-body">
                <div class="row g-4">
                  <div class="col-md-6">
                    <label for="id_nombres" class="form-label">Nombres</label>
                    <input type="text" name="nombres" id="id_nombres" value="{{ form.nombres.value|default_if_none:'' }}" class="form-control">
                  </div>
                  <div class="col-md-6">
                    <label for="id_apellidos" class="form-label">Apellidos</label>
                    <input type="text" name="apellidos" id="id_apellidos" value="{{ form.apellidos.value|default_if_none:'' }}" class="form-control">
                  </div>
                  <div class="col-md-6">
                    <label for="id_correo" class="form-label">Correo Electrónico</label>
                    <input type="email" name="correo" id="id_correo" value="{{ form.correo.value|default_if_none:'' }}" class="form-control">
                  </div>
                  <div class="col-md-3">
                    <label for="id_fecha" class="form-label">Fecha de Ingreso</label>
                    <input 
                      type="text" 
                      id="id_fecha" 
                      name="fecha" 
                      class="form-control" 
                      placeholder="DD/MM/AAAA" 
                      value="{{ form.fecha.value|date:'d/m/Y'|default_if_none:'' }}"
                      autocomplete="off">
                  </div>
                  <div class="col-md-3">
                    <label for="id_edad" class="form-label">Edad</label>
                    <input type="number" name="edad" id="id_edad" value="{{ form.edad.value|default_if_none:'' }}" class="form-control">
                  </div>
                </div>
              </div>
            </div>

            <!-- DIRECCIÓN -->
            <div class="card mb-4 border-0 shadow-sm">
              <div class="card-header bg-light fw-bold">DIRECCIÓN</div>
              <div class="card-body">
                <div class="row g-4">
                  <div class="col-md-6">
                    <label for="id_provincia" class="form-label">Provincia</label>
                    <select name="provincia" id="id_provincia" class="form-select">
                      <option value="">Seleccione una provincia</option>
                      {% for p in provincias %}
                        <option value="{{ p.id }}" {% if form.provincia.value == p.id %}selected{% endif %}>{{ p.nombre }}</option>
                      {% endfor %}
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="id_ciudad" class="form-label">Ciudad</label>
                    <select name="ciudad" id="id_ciudad" class="form-select">
                      <option value="">Seleccione una ciudad</option>
                      <!-- Las ciudades se cargarán dinámicamente -->
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label for="id_codigo_postal" class="form-label">Código Postal</label>
                    <input type="text" name="codigo_postal" id="id_codigo_postal" value="{{ form.codigo_postal.value|default_if_none:'' }}" class="form-control">
                  </div>
                  <div class="col-md-4">
                    <label for="id_telefono_casa" class="form-label">Teléfono Casa</label>
                    <input type="text" name="telefono_casa" id="id_telefono_casa" value="{{ form.telefono_casa.value|default_if_none:'' }}" class="form-control">
                  </div>
                  <div class="col-md-4">
                    <label for="id_telefono_movil" class="form-label">Teléfono Móvil</label>
                    <input type="text" name="telefono_movil" id="id_telefono_movil" value="{{ form.telefono_movil.value|default_if_none:'' }}" class="form-control">
                  </div>
                </div>
              </div>
            </div>

            <!-- CONDICIÓN DE TRABAJO -->
            <div class="card mb-4 border-0 shadow-sm">
              <div class="card-header bg-light fw-bold">CONDICIÓN DE TRABAJO</div>
              <div class="card-body">
                <div class="row g-4">
                  <div class="col-md-4">
                    <label for="id_sueldo_base" class="form-label">Sueldo Base</label>
                    <input type="text" name="sueldo_base" id="id_sueldo_base" value="{{ form.sueldo_base.value|default_if_none:'' }}" class="form-control text-end">
                  </div>
                  <div class="col-md-4">
                    <label for="id_comision" class="form-label">Comisión (%)</label>
                    <input type="text" name="comision" id="id_comision" value="{{ form.comision.value|default_if_none:'' }}" class="form-control text-end">
                  </div>
                  <div class="col-md-4">
                    <label for="id_sueldo_bruto" class="form-label">Sueldo Bruto</label>
                    <input type="text" id="id_sueldo_bruto" name="sueldo_bruto" class="form-control bg-light text-end" value="{{ form.instance.sueldo_bruto }}" readonly>
                  </div>
                </div>
              </div>
            </div>

            <!-- FOTO Y CONTRASEÑA -->
            <div class="card mb-4 border-0 shadow-sm">
              <div class="card-header bg-light fw-bold">FOTO Y CONTRASEÑA</div>
              <div class="card-body">
                <div class="row g-4">
                  <div class="col-md-8">
                    <label for="id_foto" class="form-label">Foto</label>
                    <input type="file" name="foto" id="id_foto" class="form-control mb-2" accept="image/*" onchange="vistaPreviaFoto(event)">
                    <div class="mt-2">
                      {% if trabajador.foto %}
                        <label class="form-label d-block">Imagen actual:</label>
                        <img id="preview_foto" src="{{ trabajador.foto.url }}" alt="Foto actual" class="img-thumbnail" style="max-height: 120px;">
                      {% else %}
                        <img id="preview_foto" src="#" alt="Vista previa" class="img-thumbnail d-none" style="max-height: 120px;">
                      {% endif %}
                    </div>
                  </div>
                  <div class="col-md-4">
                    <div class="row g-3">
                      <div class="col-12">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <div class="input-group">
                          <input type="password" name="password" id="id_password" value="{{ form.password.value|default_if_none:'' }}" class="form-control">
                          <button type="button" class="btn btn-outline-secondary" onclick="togglePassword()">
                            <i class="fa fa-eye"></i>
                          </button>
                        </div>
                      </div>
                      <div class="col-12">
                        <div class="form-check">
                          <input type="checkbox" name="activo" id="id_activo" class="form-check-input" {% if form.activo.value %}checked{% endif %}>
                          <label for="id_activo" class="form-check-label">¿Activo?</label>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- NUEVOS ICONOS EN LUGAR DE BOTONES -->
            <div class="d-flex justify-content-end mt-4">
              <!-- Icono Cancelar -->
              <a href="{% url 'trabajadores:listar' %}" class="btn btn-sm me-3" title="Cancelar">
                <i class="fa fa-times icon-btn"
                    data-bs-toggle="tooltip"
                    title="Cancelar"                     
                ></i>
              </a>
              
              <!-- Icono Guardar (submit del formulario) -->
              <button type="submit" class="btn btn-sm" title="{{ accion }}">
                <i class="fa fa-check icon-btn"
                    data-bs-toggle="tooltip"
                    title="{% if accion == 'Editar' %}Guardar Cambios{% else %}Crear Trabajador{% endif %}"                     
                ></i>
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<!-- SWEETALERT2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- FLATPICKR para fecha con botones Hoy y Limpiar -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const fechaInput = document.getElementById("id_fecha");
    if (fechaInput) {
      const fp = flatpickr(fechaInput, {
        locale: "es",
        dateFormat: "d/m/Y",
        altInput: true,
        altFormat: "d/m/Y",
        allowInput: true,
        clickOpens: true,
        position: "above",
        // Personalización para agregar botones
        onReady: function(selectedDates, dateStr, instance) {
          // Crear contenedor para los botones
          const buttonContainer = document.createElement('div');
          buttonContainer.className = 'flatpickr-buttons';
          buttonContainer.style.cssText = `
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-top: 1px solid #e3e3e3;
            background-color: #f8f9fa;
            gap: 8px;
          `;

          // Botón "Hoy"
          const todayBtn = document.createElement('button');
          todayBtn.type = 'button';
          todayBtn.textContent = 'Hoy';
          todayBtn.className = 'btn btn-sm btn-primary';
          todayBtn.style.cssText = 'font-size: 0.8rem; padding: 4px 12px;';
          todayBtn.onclick = function() {
            instance.setDate(new Date(), true);
          };

          // Botón "Limpiar"
          const clearBtn = document.createElement('button');
          clearBtn.type = 'button';
          clearBtn.textContent = 'Limpiar';
          clearBtn.className = 'btn btn-sm btn-secondary';
          clearBtn.style.cssText = 'font-size: 0.8rem; padding: 4px 12px;';
          clearBtn.onclick = function() {
            instance.clear();
          };

          buttonContainer.appendChild(todayBtn);
          buttonContainer.appendChild(clearBtn);

          // Añadir los botones al calendario
          instance.calendarContainer.appendChild(buttonContainer);
        }
      });
    }
  });
</script>

<!-- CHOICES.JS (CDN) - Evita errores 404 -->
<link rel="stylesheet" href="{% static 'css/choices.min.css' %}">
<script src="{% static 'js/choices.min.js' %}"></script>

<!-- Datos de ciudades en JSON -->
<script id="ciudades-data" type="application/json">
    {{ ciudades_json|safe }}
</script>

<!-- ===== CORRECCIÓN PRINCIPAL: JavaScript para Provincia y Ciudad ===== -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    console.log("=== DEBUG: DOMContentLoaded ===");

    // Verificar si Choices.js está disponible
    if (typeof Choices === 'undefined') {
      console.error('ERROR: Choices.js no se cargó correctamente');
      // Fallback con JavaScript vanilla
      initVanillaSelects();
      return;
    }

    // Obtener datos
    const ciudadesData = JSON.parse(document.getElementById('ciudades-data').textContent);
    const ciudadInicial = "{{ ciudad_inicial|default:'' }}";
    const provinciaInicial = "{{ provincia_inicial|default:'' }}";

    console.log("Provincia Inicial:", provinciaInicial);
    console.log("Ciudad Inicial:", ciudadInicial);
    console.log("Datos de ciudades cargados:", ciudadesData.length);

    // Inicializar Choices.js
    const provinciaSelect = new Choices('#id_provincia', {
      searchEnabled: true,
      searchPlaceholderValue: 'Buscar provincia...',
      itemSelectText: '',
      shouldSort: false,
      placeholderValue: 'Seleccione una provincia',
      position: 'bottom',
      allowHTML: true
    });

    const ciudadSelect = new Choices('#id_ciudad', {
      searchEnabled: true,
      searchPlaceholderValue: 'Buscar ciudad...',
      itemSelectText: '',
      shouldSort: false,
      placeholderValue: 'Seleccione una ciudad',
      position: 'bottom',
      allowHTML: true
    });

    // Función para cargar ciudades
    function cargarCiudades(provinciaId) {
      console.log("=== Cargando ciudades para provincia:", provinciaId, "===");
      
      // Limpiar opciones actuales
      ciudadSelect.clearStore();
      ciudadSelect.setChoices([{ value: '', label: 'Seleccione una ciudad', disabled: false }], 'value', 'label', true);

      if (!provinciaId || provinciaId === '') {
        console.log("No hay provincia seleccionada, limpiando ciudades");
        return;
      }

      // Filtrar ciudades por provincia
      const ciudadesFiltradas = ciudadesData.filter(ciudad => ciudad.provincia_id == provinciaId);
      console.log("Ciudades encontradas:", ciudadesFiltradas.length);

      if (ciudadesFiltradas.length === 0) {
        console.log("No se encontraron ciudades para esta provincia");
        return;
      }

      // Crear opciones
      const opciones = ciudadesFiltradas.map(ciudad => ({
        value: ciudad.id.toString(),
        label: ciudad.nombre
      }));

      // Añadir opciones
      ciudadSelect.setChoices(opciones, 'value', 'label', false);
      console.log("Opciones de ciudad añadidas:", opciones.length);

      // Seleccionar ciudad inicial si corresponde a esta provincia
      if (ciudadInicial && ciudadInicial !== '') {
        const ciudadCorrespondiente = ciudadesFiltradas.find(c => c.id == ciudadInicial);
        if (ciudadCorrespondiente) {
          setTimeout(() => {
            ciudadSelect.setChoiceByValue(ciudadInicial.toString());
            console.log("✅ Ciudad inicial seleccionada:", ciudadInicial);
          }, 100);
        }
      }
    }

    // Event listener para cambio de provincia
    document.getElementById('id_provincia').addEventListener('change', function(e) {
      const nuevaProvincia = e.target.value;
      console.log("Provincia cambiada a:", nuevaProvincia);
      cargarCiudades(nuevaProvincia);
    });

    // Inicialización: cargar ciudades si hay provincia inicial
    if (provinciaInicial && provinciaInicial !== '') {
      console.log("Inicializando con provincia:", provinciaInicial);
      // Establecer provincia inicial
      provinciaSelect.setChoiceByValue(provinciaInicial.toString());
      // Cargar ciudades correspondientes
      cargarCiudades(provinciaInicial);
    } else {
      console.log("No hay provincia inicial, limpiando ciudades");
      cargarCiudades(null);
    }

    // ===== FUNCIÓN FALLBACK SIN CHOICES.JS =====
    function initVanillaSelects() {
      console.log("Inicializando selectores vanilla (sin Choices.js)");
      
      const provinciaSelect = document.getElementById('id_provincia');
      const ciudadSelect = document.getElementById('id_ciudad');
      
      function cargarCiudadesVanilla(provinciaId) {
        // Limpiar opciones
        ciudadSelect.innerHTML = '<option value="">Seleccione una ciudad</option>';
        
        if (!provinciaId) return;
        
        // Filtrar y añadir ciudades
        const ciudadesFiltradas = ciudadesData.filter(ciudad => ciudad.provincia_id == provinciaId);
        ciudadesFiltradas.forEach(ciudad => {
          const option = document.createElement('option');
          option.value = ciudad.id;
          option.textContent = ciudad.nombre;
          if (ciudadInicial && ciudad.id == ciudadInicial) {
            option.selected = true;
          }
          ciudadSelect.appendChild(option);
        });
      }
      
      // Event listener para provincia
      provinciaSelect.addEventListener('change', function(e) {
        cargarCiudadesVanilla(e.target.value);
      });
      
      // Inicialización
      if (provinciaInicial) {
        provinciaSelect.value = provinciaInicial;
        cargarCiudadesVanilla(provinciaInicial);
      }
    }
    
    // Inicializar tooltips de Bootstrap
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl)
    })
  });
</script>

<!-- Resto de scripts originales -->
<script>
  function vistaPreviaFoto(event) {
    const input = event.target;
    const preview = document.getElementById('preview_foto');
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        preview.src = e.target.result;
        preview.classList.remove('d-none');
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function togglePassword() {
    const pwd = document.getElementById("id_password");
    pwd.type = pwd.type === "password" ? "text" : "password";
  }

// FUNCIONES CORREGIDAS PARA EL FORMATEO DE NÚMEROS

  function formatNumber(num) {
      if (!num || num === '' || num === '0' || num === 0) return '';
      
      // Convertir a número si es string
      let cleanNumber = typeof num === 'string' ? parseFloat(num) : num;
      
      if (isNaN(cleanNumber)) return '';
      
      // Formatear con separadores de miles pero SIN dividir por 100
      return cleanNumber.toLocaleString('es-ES', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
      });
  }

  function unformatNumber(str) {
      if (!str) return '';
      // Remover separadores de miles (puntos) y convertir coma decimal a punto
      // NO multiplicar por 100
      return str.toString().replace(/\./g, '').replace(',', '.');
  }

  // APLICAR FORMATO INICIAL A LOS CAMPOS NUMÉRICOS - VERSIÓN CORREGIDA
  document.addEventListener('DOMContentLoaded', function() {
      const baseInput = document.getElementById("id_sueldo_base");
      const comisionInput = document.getElementById("id_comision");
      const brutoInput = document.getElementById("id_sueldo_bruto");

      // Formatear valores iniciales si existen - SIN MULTIPLICAR
      if (baseInput.value && baseInput.value !== '') {
          // Si el valor viene del servidor, formatearlo directamente
          baseInput.value = formatNumber(parseFloat(baseInput.value));
      }
      if (comisionInput.value && comisionInput.value !== '') {
          comisionInput.value = formatNumber(parseFloat(comisionInput.value));
      }
      if (brutoInput.value && brutoInput.value !== '') {
          brutoInput.value = formatNumber(parseFloat(brutoInput.value));
      }

      function calcularBruto() {
          const baseValue = unformatNumber(baseInput.value) || 0;
          const comisionValue = unformatNumber(comisionInput.value) || 0;
          const base = parseFloat(baseValue) || 0;
          const comision = parseFloat(comisionValue) || 0;
          const bruto = base + comision;
          brutoInput.value = formatNumber(bruto);
      }

      // Event listeners para formateo automático en Sueldo Base
      baseInput.addEventListener('blur', function() {
          if (this.value && this.value !== '') {
              const unformatted = unformatNumber(this.value);
              this.value = formatNumber(parseFloat(unformatted));
          }
          calcularBruto();
      });

      baseInput.addEventListener('focus', function() {
          this.value = unformatNumber(this.value);
      });

      // Event listeners para formateo automático en Comisión
      comisionInput.addEventListener('blur', function() {
          if (this.value && this.value !== '') {
              const unformatted = unformatNumber(this.value);
              this.value = formatNumber(parseFloat(unformatted));
          }
          calcularBruto();
      });

      comisionInput.addEventListener('focus', function() {
          this.value = unformatNumber(this.value);
      });

      // Cálculo automático en tiempo real
      baseInput.addEventListener('input', calcularBruto);
      comisionInput.addEventListener('input', calcularBruto);

      // Calcular bruto inicial
      calcularBruto();
  });

  // MANEJO DEL FORMULARIO - VERSIÓN CORREGIDA
  document.getElementById('trabajadorForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      
      // Desformatear valores antes del envío
      const baseInput = document.getElementById("id_sueldo_base");
      const comisionInput = document.getElementById("id_comision");
      
      const baseOriginal = baseInput.value;
      const comisionOriginal = comisionInput.value;
      
      // Desformatear para envío al servidor
      baseInput.value = unformatNumber(baseOriginal);
      comisionInput.value = unformatNumber(comisionOriginal);
      
      const formData = new FormData(form);
      const url = form.action || window.location.pathname;

      try {
          const response = await fetch(url, {
              method: "POST",
              headers: {
                  "X-CSRFToken": form.querySelector("[name=csrfmiddlewaretoken]").value,
              },
              body: formData
          });

          const data = await response.json();

          if (data.success) {
              Swal.fire({
                  icon: 'success',
                  title: 'Éxito',
                  text: data.message,
                  confirmButtonColor: '#28a745'
              }).then(() => {
                  window.location.href = "{% url 'trabajadores:listar' %}";
              });
          } else {
              let html = '';
              data.errors.forEach(err => {
                  html += `<div>• ${err}</div>`;
              });
              Swal.fire({
                  icon: 'error',
                  title: 'Errores de validación',
                  html: html,
                  confirmButtonColor: '#e74c3c'
              });
              
              // Restaurar formato en caso de error
              baseInput.value = baseOriginal;
              comisionInput.value = comisionOriginal;
          }
      } catch (error) {
          Swal.fire({
              icon: 'error',
              title: 'Error del servidor',
              text: 'Ocurrió un error inesperado. Intenta nuevamente.'
          });
          
          // Restaurar formato en caso de error
          baseInput.value = baseOriginal;
          comisionInput.value = comisionOriginal;
      }
  });

  function confirmarEliminar(trabajadorId) {
    Swal.fire({
      title: '¿Estás seguro?',
      text: "Esta acción no se puede deshacer.",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'Sí, eliminar',
      cancelButtonText: 'Cancelar'
    }).then((result) => {
      if (result.isConfirmed) {
        // Redirigir directamente a la URL de eliminar (GET request que maneja Django)
        window.location.href = `/eliminar/${trabajadorId}/`;      
      }
    });
  }
</script>
