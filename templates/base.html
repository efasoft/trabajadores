{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Gestión de Trabajadores{% endblock %}</title>

  <!-- Bootstrap 5 desde CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome Free -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- CSS personalizado -->
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: -webkit-linear-gradient(90deg, #5c5c5c,#333333,#000000,#000000,#000000);background: linear-gradient(90deg, #5c5c5c,#333333,#000000,#000000,#000000);
        }

        header {
            background-color: #222;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .btn-link {
            border: none;
            background: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            padding: 0;
        }
    </style>
</head>
<body>
    <header>
        <div>Gestión de Trabajadores</div>
        <nav>
            <a href="{% url 'home' %}">Inicio</a>
            <a href="{% url 'trabajadores:listar' %}">Trabajadores</a>
            {% if user.is_authenticated %}
                <button class="btn-link" onclick="confirmarCerrarSesion()">Cerrar sesión</button>
            {% else %}
                <a href="{% url 'usuarios:login' %}">Iniciar sesión</a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <script>
    function confirmarCerrarSesion() {
        Swal.fire({
            title: "¿Cerrar sesión?",
            text: "¿Estás seguro de que deseas salir?",
            icon: "question",
            showCancelButton: true,
            confirmButtonColor: "#3085d6",
            cancelButtonColor: "#d33",
            confirmButtonText: "Sí, cerrar",
            cancelButtonText: "Cancelar"
        }).then((result) => {
            if (result.isConfirmed) {
                window.location.href = "{% url 'usuarios:logout' %}";
            }
        });
    }
    </script>
</body>
</html>
