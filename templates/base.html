{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Gestión de Trabajadores{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Estilos personalizados -->
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">

  <style>
    body {
      margin: 0;
      padding-top: 70px;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(90deg, #000000, #124a49, #0a8494);
    }

    .navbar-custom {
      background-color: rgba(17, 17, 17, 0.6);
      backdrop-filter: blur(4px);
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .navbar-brand {
      font-size: 1.7rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 1px 1px 4px #0a8494;
    }

    .navbar-nav .nav-link {
      color: #fff;
      font-size: 1.2rem;
      margin-left: 15px;
      transition: color 0.3s ease;
    }

    .navbar-nav .nav-link:hover {
      color: #00d4ff;
    }

    .nav-icon {
      font-size: 1.4rem;
    }

    .container {
      padding: 20px;
    }

    .btn-link {
      border: none;
      background: none;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1em;
      padding: 0;
    }

    @media (max-width: 767px) {
      .navbar-brand { font-size: 1.4rem; }
      .nav-icon { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

<!-- Barra de Navegación -->
<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Gestión de Trabajadores</a>

    <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"><i class="fa fa-bars text-white"></i></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav align-items-center">
        <li class="nav-item">
          {% if user.is_authenticated %}
            <a class="nav-link" href="{% url 'home' %}" data-bs-toggle="tooltip" title="Inicio">
              <i class="fas fa-house nav-icon"></i>
            </a>
          {% else %}
            <a class="nav-link" href="#" onclick="mostrarAlertaAcceso()" data-bs-toggle="tooltip" title="Inicio">
              <i class="fas fa-house nav-icon"></i>
            </a>
          {% endif %}
        </li>
        <li class="nav-item">
          {% if user.is_authenticated %}
            <a class="nav-link" href="#" onclick="confirmarCerrarSesion()" data-bs-toggle="tooltip" title="Cerrar sesión">
              <i class="fas fa-sign-out-alt nav-icon"></i>
            </a>
          {% else %}
            <a class="nav-link" href="{% url 'usuarios:login' %}" data-bs-toggle="tooltip" title="Iniciar sesión">
              <i class="fas fa-sign-in-alt nav-icon"></i>
            </a>
          {% endif %}
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Contenido -->
<div class="container">
  {% block content %}{% endblock %}
</div>

<!-- Scripts -->
<script>
  function confirmarCerrarSesion() {
    Swal.fire({
      title: "¿Cerrar sesión?",
      text: "¿Estás seguro de que deseas salir?",
      icon: "question",
      showCancelButton: true,
      confirmButtonColor: "#3085d6",
      cancelButtonColor: "#d33",
      confirmButtonText: "Sí, cerrar",
      cancelButtonText: "Cancelar"
    }).then((result) => {
      if (result.isConfirmed) {
        window.location.href = "{% url 'usuarios:logout' %}";
      }
    });
  }

  function mostrarAlertaAcceso() {
    Swal.fire({
      icon: 'warning',
      title: 'Acceso restringido',
      text: 'Primero debes iniciar sesión para acceder a esta sección.',
      confirmButtonColor: '#0a8494'
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function (tooltipTriggerEl) {
      return new bootstrap.Tooltip(tooltipTriggerEl);
    });
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
