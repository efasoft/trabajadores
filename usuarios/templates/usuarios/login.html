{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<style>
  body {
    background: url("{% static 'img/efa-login-02.jpg' %}") no-repeat center center fixed;
    background-size: cover;
    font-family: 'Segoe UI', sans-serif;
  }

  .login-container {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .login-box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 12px;
    padding: 2.5rem 3rem;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.3);
    color: white;
  }

  .login-box h2 {
    text-align: center;
    margin-bottom: 1.5rem;
    font-weight: 700;
    color: #fff;
  }

  .form-control {
    background: rgba(255, 255, 255, 0.15);
    border: none;
    border-radius: 8px;
    padding: 0.8rem;
    margin-bottom: 1.2rem;
    color: white;
  }

  .form-control::placeholder {
    color: rgba(255, 255, 255, 0.7);
  }

  .btn-login {
    background: linear-gradient(to right, #6a11cb, #2575fc);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0.8rem;
    width: 100%;
    font-weight: bold;
    font-size: 1rem;
    transition: 0.3s;
  }

  .btn-login:hover {
    opacity: 0.9;
    transform: scale(1.02);
  }

  .text-center a {
    color: #ccc;
    text-decoration: none;
    font-size: 0.9rem;
  }

  .toggle-password {
    position: absolute;
    right: 1rem;
    top: 0.9rem;
    color: white;
    cursor: pointer;
  }

  .input-group {
    position: relative;
  }
</style>

<div class="login-container">
  <div class="login-box">
    <h2>Login</h2>

    <form method="post" action="{% url 'usuarios:login' %}">
      {% csrf_token %}

      <input type="text" name="username" placeholder="Username" class="form-control" required>

      <div class="input-group">
        <input type="password" name="password" id="password" placeholder="Password" class="form-control" required>
        <span toggle="#password" class="toggle-password" onclick="togglePassword()">
          <i class="fas fa-eye" id="eye-icon"></i>
        </span>
      </div>

      <button type="submit" class="btn-login mt-2">Entrar</button>
    </form>

    <div class="text-center mt-3">
      ¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Crear cuenta</a>
    </div>
  </div>
</div>

<!-- FontAwesome para íconos -->
<script src="https://kit.fontawesome.com/a2d9d6c28d.js" crossorigin="anonymous"></script>

<!-- Toggle Password -->
<script>
  function togglePassword() {
    const input = document.getElementById("password");
    const icon = document.getElementById("eye-icon");
    if (input.type === "password") {
      input.type = "text";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    } else {
      input.type = "password";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    }
  }
</script>

<!-- Mostrar error si las credenciales son inválidas -->
{% if form.errors %}
<script>
  Swal.fire({
    icon: 'error',
    title: 'Error de autenticación',
    text: 'Usuario o contraseña incorrectos.',
    confirmButtonColor: '#6a11cb'
  });
</script>
{% endif %} 

{% endblock %}
