{% extends "base.html" %}
{% block title %}Iniciar Sesión{% endblock %}
{% block content %}
<form method="post" class="bg-white p-4 rounded shadow mt-5">
  {% csrf_token %}
  <h3 class="text-center mb-4 text-dark"><i class="fas fa-sign-in-alt"></i> Iniciar Sesión</h3>
  <div class="mb-3">
    <label for="id_username" class="form-label">Usuario</label>
    <input type="text" name="username" id="id_username" class="form-control" required>
  </div>
  <div class="mb-3">
    <label for="id_password" class="form-label">Contraseña</label>
    <div class="position-relative">
      <input type="password" name="password" id="id_password" class="form-control" required>
    </div>
  </div>
  <div class="d-flex justify-content-between">
    <button type="submit" class="btn btn-primary"><i class="fas fa-unlock-alt"></i> Entrar</button>
    <a href="{% url 'usuarios:register' %}" class="btn btn-secondary"><i class="fas fa-user-plus"></i> Crear cuenta</a>
  </div>
</form>
{% endblock %}
